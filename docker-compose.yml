version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # CORE PROFILE (API, Qdrant, Redis, Ollama)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: genai-platform-plus:latest
    container_name: genai-api
    profiles: ["core", "full"]
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-ollama}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - OPENAI_MODEL=${OPENAI_MODEL:-gemini-2.5-flash}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - GEMINI_EMBEDDING_DIM=768
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=knowledge_base
      - REDIS_URL=redis://redis:6379/0
      - RERANKER_BACKEND=${RERANKER_BACKEND:-lexical}
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - RERANK_CANDIDATES=20
      - API_KEYS=${API_KEYS:-dev-secret-key,test-key-123}
      - MAX_UPLOAD_MB=25
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse-web:3000
    volumes:
      - ./data/raw:/app/data/raw
      - ./artifacts:/app/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: genai-qdrant
    profiles: ["core", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: genai-redis
    profiles: ["core", "full"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: genai-ollama
    profiles: ["core", "full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FULL PROFILE (Langfuse v3 Observability, Prometheus, Grafana)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: genai-prometheus
    profiles: ["full"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: genai-grafana
    profiles: ["full"]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-web
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=secret-nextauth-token-12345
      - SALT=salt-secret-value-12345
    depends_on:
      - langfuse-postgres
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres
    profiles: ["full"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  ollama_data:
  grafana_data:
  postgres_data:
